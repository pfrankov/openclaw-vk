name: Bootstrap canonical OpenClaw SDK migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/openclaw-2026-8-sdk-canonical'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply canonical SDK migration
        run: |
          base64 --decode .github/canonical-sdk-fix.mjs.gz.b64 | gzip --decompress > /tmp/apply-canonical-sdk-fix.mjs
          node --check /tmp/apply-canonical-sdk-fix.mjs
          node /tmp/apply-canonical-sdk-fix.mjs
          rm .github/canonical-sdk-fix.mjs.gz.b64

      - name: Commit generated changes
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: migrate VK plugin to canonical OpenClaw 2026.8 SDK"
          git push origin "HEAD:${HEAD_BRANCH}"
